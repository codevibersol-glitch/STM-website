# Netlify co-deploy: static stm-website + stm-api as a Function under /api/*

[build]
  command = "node scripts/sync-api.mjs && npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"
  # Same-origin API (rewritten to the Function). Override only if the API is hosted elsewhere.
  VITE_API_URL = "/api"
  # Public site URLs, Stripe product IDs, and on-chain wallet addresses also appear as
  # documented defaults in repo source; omit them from Netlify secrets scanning so builds
  # are not blocked. Real secrets (DATABASE_*, STRIPE_SECRET_*, SESSION_SECRET, webhook) stay scanned.
  SECRETS_SCAN_OMIT_KEYS = "PUBLIC_URL,STRIPE_SUCCESS_URL,STRIPE_CANCEL_URL,STRIPE_PRODUCT_FLEX,STRIPE_PRODUCT_GO,STRIPE_PRODUCT_FOUNDER,CRYPTO_WALLET_BTC,CRYPTO_WALLET_ETH,CRYPTO_WALLET_BNB,CRYPTO_WALLET_SOL,ADMIN_EMAILS,CORS_ORIGIN"

[context.production.environment]
  SITE_URL = "https://stm-addon.netlify.app"
  VITE_API_URL = "/api"

[functions]
  node_bundler = "esbuild"
  # libsql may ship platform natives; keep external so Netlify can resolve them.
  external_node_modules = ["@libsql/client"]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api"
  status = 200
  force = true

[[redirects]]
  from = "/api"
  to = "/.netlify/functions/api"
  status = 200
  force = true
